<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Favicon de 16/32 px: solo la forma principal (la hoja), sin visor, corchetes ni símbolo de
       reciclaje, que a ese tamaño no se leen. -->
