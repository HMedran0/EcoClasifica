<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EcoClasifica">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86C423"/>
      <stop offset="0.45" stop-color="#42963F"/>
      <stop offset="0.75" stop-color="#0C5A3B"/>
      <stop offset="1" stop-color="#03393B"/>
    </linearGradient>
    <!-- Una flecha del triángulo de reciclaje (pliegue en un vértice + punta). Las tres son
         idénticas, giradas 120° sobre el mismo centro, con ~27 px de separación entre ellas. -->
    <g id="flecha" fill="#42963F">
      <path d="M-9.7 -63.2 L0 -80 L30.48 -27.2" fill="none" stroke="#42963F" stroke-width="30" stroke-linejoin="round"/>
      <path d="M53 -40.2 L7.97 -14.2 L44.34 -3.2 Z"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>

  <!-- Visor de la cámara -->
  <rect x="196" y="88" width="124" height="46" rx="18" fill="#FFFFFF"/>
  <circle cx="292" cy="111" r="10" fill="#42963F"/>

  <!-- Corchetes de enfoque (el superior derecho lo ocupa la punta de la hoja) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 214 V176 A24 24 0 0 1 124 152 H164"/>
    <path d="M100 352 V390 A24 24 0 0 0 124 414 H164"/>
    <path d="M412 352 V390 A24 24 0 0 1 388 414 H348"/>
  </g>

  <!-- Hoja -->
  <path d="M424 150 C410 290 344 400 246 400 C172 400 132 346 138 284 C146 206 236 162 424 150 Z" fill="#FFFFFF"/>
  <path d="M404 172 Q380 208 352 236" fill="none" stroke="#42963F" stroke-width="14" stroke-linecap="round"/>

  <!-- Símbolo de reciclaje -->
  <g transform="translate(260 300)">
    <use href="#flecha"/>
    <use href="#flecha" transform="rotate(120)"/>
    <use href="#flecha" transform="rotate(240)"/>
  </g>
</svg>
