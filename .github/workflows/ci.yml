name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # El build de producción del frontend exige VITE_API_URL (vite.config.ts); aquí basta una URL local.
          VITE_API_URL: http://localhost:3000
